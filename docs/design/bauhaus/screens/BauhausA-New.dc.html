<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counters – Bauhaus new counter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
button,input{font-family:inherit}
input::placeholder{color:#7A7466}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EFE8D8; font-family: 'Jost', system-ui, sans-serif; color: #141414; position: relative; overflow: hidden">
  <div style="padding: 26px 20px 14px; font-size: 30px; font-weight: 700; border-bottom: 4px solid #141414">counters</div>
  <div style="position: absolute; inset: 0; background: rgba(20, 20, 20, 0.5)"></div>
  <section aria-label="New counter" style="position: absolute; left: 0; right: 0; bottom: 0; background: #EFE8D8; border-top: 4px solid #141414; padding: 16px 20px 28px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.01em">new counter</h2>
      <button aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: #141414">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      </button>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="n-name" style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Name</label>
      <input id="n-name" placeholder="e.g. Since our last holiday" style="height: 52px; box-sizing: border-box; padding: 0 14px; border: 2px solid #141414; border-radius: 0; background: #F8F3E8; font-size: 17px; color: #141414">
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Started</span>
      <div style="display: flex; gap: 8px">
        <button style="flex: 1.4; height: 52px; border: 2px solid #141414; background: #F8F3E8; font-size: 16px; color: #141414; text-align: left; padding: 0 14px">Tue 17 Nov 2026</button>
        <button style="flex: 1; height: 52px; border: 2px solid #141414; background: #F8F3E8; font-size: 16px; color: #141414; font-variant-numeric: tabular-nums">13:46</button>
        <button style="height: 52px; padding: 0 14px; border: 2px solid #141414; background: #141414; font-size: 14px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #EFE8D8">Now</button>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Precision</span>
      <div role="radiogroup" aria-label="Precision" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border: 2px solid #141414">
        <sc-for list="{{precs}}" as="o" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{o.on}}" onClick="{{o.pick}}" style="height: 44px; border: 0; border-left: {{o.sep}}; background: {{o.bg}}; color: {{o.fg}}; font-size: 15px; font-weight: 600">{{o.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase">Goal <span style="font-weight: 400; letter-spacing: 0.04em; text-transform: none; color: #3F3A31">· optional, sets when the shape is full size</span></span>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <sc-for list="{{goals}}" as="g" hint-placeholder-count="5">
          <button aria-pressed="{{g.on}}" onClick="{{g.pick}}" style="height: 44px; padding: 0 14px; border: 2px {{g.border}} #141414; background: {{g.bg}}; color: {{g.fg}}; font-size: 15px; font-weight: 600">{{g.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: #F8F3E8; border: 2px solid #141414">
      <svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true" style="flex: none"><path d="M50 0A50 50 0 1 1 49.99 0Z" fill="#1F4FA3"></path></svg>
      <span style="font-size: 14px; line-height: 1.35">New counters go to the top and get the <b>blue circle</b>. The others shift along.</span>
    </div>
    <button style="width: 100%; height: 58px; border: 0; background: #141414; color: #EFE8D8; font-size: 17px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase">Start counter</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const prec = st.prec || 'Days';
    const goal = st.goal || 'None';
    const precs = ['Days', 'Hours', 'Secs', '1/100'].map((l, i) => ({
      label: l, on: l === prec, bg: l === prec ? '#141414' : '#F8F3E8', fg: l === prec ? '#EFE8D8' : '#141414',
      sep: i ? '2px solid #141414' : '0 solid transparent', pick: () => this.setState({ prec: l })
    }));
    const goals = ['None', '7 days', '30 days', '90 days', 'Custom…'].map((l) => ({
      label: l, on: l === goal, bg: l === goal ? '#141414' : '#F8F3E8', fg: l === goal ? '#EFE8D8' : '#141414',
      border: l === 'Custom…' && l !== goal ? 'dashed' : 'solid',
      pick: () => this.setState({ goal: l })
    }));
    return { precs, goals };
  }
}
</script>
</body>
</html>
